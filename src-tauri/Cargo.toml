[package]
name = "swath"
version = "0.1.0"
description = "A lightweight terminal-first project/workspace manager for coding agents."
authors = ["Generated with ChatGPT"]
license = "MIT"
edition = "2021"

[lib]
name = "swath_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "swath"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
anyhow = "1"
thiserror = "2"
once_cell = "1"
base64 = "0.22"
trash = "5"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread"] }
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
tower-http = { version = "0.6", features = ["cors"] }
base64ct = { version = "1", features = ["alloc"] }
hostname = "0.4"

# Install scripts are used repeatedly during development; retain optimized
# incremental artifacts so backend edits do not require a full release rebuild.
[profile.release]
incremental = true
# Cargo's implicit macOS stripping invokes a rust-objcopy binary with a broken library search path.
strip = false
